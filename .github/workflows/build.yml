name: build

# Regenerates everything from entries/ and backlog.yaml, fails if the committed
# dist/ has drifted from its sources, then publishes site/ to GitHub Pages.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes exact version tags only (no floating v10), so pin the release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install dependencies
        # --locked fails rather than silently re-resolving if uv.lock is out of date.
        run: uv sync --locked --group notebooks

      - name: Test the linker
        run: uv run python tests/test_linker.py

      - name: Run the notebooks as scripts
        # marimo notebooks are plain Python; their asserts check the worked examples
        run: uv run --group notebooks python build/build_notebooks.py --check

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - name: Run the Python and Julia snippets
        # each snippet section asserts its result on the hand-worked toy example
        run: uv run --group notebooks python build/check_snippets.py --require-julia

      - name: Regenerate dist/
        run: uv run python build/build_all.py

      - name: Fail if generated files are stale
        # dist/ is generated from entries/ and backlog.yaml; the Julia blocks inside
        # notebooks/ are generated from snippets/
        run: |
          if ! git diff --quiet -- dist notebooks; then
            echo "::error::dist/ or the generated blocks in notebooks/ do not match their sources."
            echo "Run 'uv run python build/build_all.py' locally and commit the result."
            git --no-pager diff --stat -- dist notebooks
            exit 1
          fi
          echo "dist/ and notebooks/ are up to date with their sources"

      - name: Build static site
        run: uv run python build/build_site.py

      - name: Export notebooks into the site
        # after build_site.py, which recreates site/ from scratch
        run: uv run --group notebooks python build/build_notebooks.py

      - name: Verify the site has no absolute links
        # An absolute path breaks a project site served under /<repo>/.
        run: |
          if grep -rn 'href="/' site/ ; then
            echo "::error::absolute href found; use relative links so the site works under a path prefix"
            exit 1
          fi
          test -f site/.nojekyll || { echo "::error::site/.nojekyll missing"; exit 1; }
          echo "site/ links are relative and .nojekyll is present"

      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
