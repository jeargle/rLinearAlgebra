# Term registry: candidate Wikipedia links for terms used in the seed entries.
#
# Read by build/common.py: every term with a url is linked at its first use on each page it belongs to.
#
# Every url was verified against the Wikipedia API on 2026-09-29: the article exists, redirects are
# resolved to their final target, and no target is a disambiguation page. Section anchors (#...)
# were checked against the article's current section list.
#
# recommend:  link      - a dedicated article that matches the sense used in the entry
#             optional  - article exists, but the word is familiar or the article is broader or more
#                         advanced than the entry needs
#             none      - no suitable article; define the term inline instead
# entries:     seed entry ids where the term appears (in the sense given)
# lowest_tier: lowest tier among those entries; the first reader to meet the term
# uses:        occurrences across those entries
#
# match:       regular expressions for this term's link text. A pattern containing a capital letter is
#              case-sensitive; an all-lowercase pattern is not. A match is extended to the end of its
#              word, so 'stoichiometr' links 'stoichiometric'. The first match on a page is linked.
#              Patterns are applied only on pages for the term's own entries, so the same abbreviation
#              can mean different things in different entries.
#
# URLs percent-encode parentheses, so they survive inside markdown links, including on Reddit.

